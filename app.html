function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
function play(path){if(!soundEnabled)return;try{const a=new Audio(`${ASSET_BASE}sounds/${path}`);a.volume=.75;a.play().catch(()=>{})}catch(e){}}
function reveal(b,dim=false){const box=grid.querySelector(`.character[data-number="${b.number}"]`);if(!box)return;box.classList.add('answered');const img=box.querySelector('img');img.src=imgUrl(b.id);img.alt=b.name;img.style.filter=dim?'grayscale(100%)':'';img.style.opacity=dim?'.52':'1';let label=box.querySelector('.character-name');if(!label){label=document.createElement('div');label.className='character-name';box.appendChild(label)}label.textContent=b.name}
function updateCount(){document.getElementById('count').textContent=answered.size;document.getElementById('remaining').textContent=TOTAL-answered.size}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1100)}
function checkAnswer(){if(finished)return;const raw=input.value;input.value='';const key=normalizeName(raw);if(!key)return;const b=lookup.get(key);if(!b){play('%E5%A4%B1%E6%95%97.mp3');toast('등록된 브롤러가 아니에요');return}if(answered.has(b.number)){play('%E3%83%9F%E3%82%B9.mp3');toast('이미 맞힌 브롤러예요');return}answered.add(b.number);if(answered.size===1)startTimer();reveal(b);updateCount();play('%E3%83%94%E3%83%83%E3%82%AF%E9%9F%B3.mp3');if(answered.size===TOTAL)completeGame()}
function completeGame(){finished=true;stopTimer();input.disabled=true;answerButton.disabled=true;giveUpButton.disabled=true;document.getElementById('clearTime').textContent=formatTime();const comments=['브롤러 지식만큼은 프로급!','106명을 전부 기억했다고? 대단해요.','이 정도면 브롤스타즈 도감 그 자체!','완벽 클리어! 정말 빠짐없이 맞혔네요.','브롤러 이름 시험 만점!'];document.getElementById('clearComment').textContent=comments[Math.floor(Math.random()*comments.length)];openModal('clearModal')}
function giveUp(){if(finished)return;finished=true;stopTimer();BRAWLERS.forEach(b=>reveal(b,!answered.has(b.number)));input.disabled=true;answerButton.disabled=true;giveUpButton.disabled=true;document.getElementById('giveUpCount').textContent=answered.size;document.getElementById('giveUpTime').textContent=formatTime();const comments=['다음엔 더 많이 맞힐 수 있어요!','여기까지 기억한 것도 충분히 좋아요.','놓친 브롤러를 확인하고 한 번 더 도전!','이번 기록을 기억해 두고 다시 도전해 보세요.'];document.getElementById('giveUpComment').textContent=comments[Math.floor(Math.random()*comments.length)];openModal('giveUpModal')}
function confirmGiveUp(){if(finished)return;if(confirm('정말 포기할까요? 남은 브롤러의 정답이 모두 공개됩니다.'))giveUp()}
function openModal(id){document.getElementById('backdrop').classList.add('show');document.getElementById(id).classList.add('show')}
function closeModals(){document.getElementById('backdrop').classList.remove('show');document.querySelectorAll('.modal.show').forEach(x=>x.classList.remove('show'))}
function shareToX(){const text=`브롤스타즈 모든 브롤러 말할 수 있을까?\n${answered.size} / ${TOTAL}명 정답!\n시간: ${formatTime()}\n#브롤스타즈 #브롤러퀴즈`;window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent('https://naver.me/xLNkDqy6'),'_blank','noopener')}
function restartGame(){location.reload()}

answerButton.addEventListener('click',checkAnswer);giveUpButton.addEventListener('click',confirmGiveUp);input.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});document.getElementById('backdrop').addEventListener('click',closeModals);document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModals));document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',shareToX));document.querySelectorAll('[data-restart]').forEach(b=>b.addEventListener('click',restartGame));
const soundOnBtn=document.getElementById('soundOnBtn'),soundOffBtn=document.getElementById('soundOffBtn');function updateSound(){soundOnBtn.classList.toggle('active',soundEnabled);soundOffBtn.classList.toggle('active',!soundEnabled)}soundOnBtn.addEventListener('click',()=>{soundEnabled=true;updateSound()});soundOffBtn.addEventListener('click',()=>{soundEnabled=false;updateSound()});
renderGrid();updateCount();updateSound();input.focus();
</script>
</body>
</html>
